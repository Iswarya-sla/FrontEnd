<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 100px;
            height: 100px;
            border: 1px solid black;
            background-color: blue;
            transition: 1s;
            border-radius: 50%;
        }
        div:hover{
            background-color: green;
            box-shadow: 5px 5px 5px red;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <center><div></div></center>
    
</body>
</html>

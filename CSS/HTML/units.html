<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            font-size: 20px;
            width: 700px;
            height: 500px;
            border: 1px solid black;
        }
        .px{
            font-size: 34px;
            color: red;
        }
        .em{
            font-size: 2em;
            color: blue;
        }
        .rem{
            font-size: 2rem;
            color: violet;
        }
        .percent{
            width: 80%;
            border: 2px solid red;
        }
        .vhvw{
            width: 50vw;
            height: 50vh;
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <div class="parent">
        <p class="px">Lorem ipsum dolor sit amet.</p>
        <p class="em">Lorem, ipsum.</p>
        <p class="rem">Lorem ipsum dolor sit amet consectetur adipisicing elit. Laboriosam, optio.</p>
        <p class="percent"></p>
        <p class="vhvw"></p>
    </div>
</body>
</html>
